name: Update gig listings

on:
  schedule:
    - cron: "7 21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-gigs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch posts, extract shows, rebuild site
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m gigradar.run
      - name: Commit updated listings
        if: always()
        run: |
          git config user.name "gig-radar-bot"
          git config user.email "gig-radar-bot@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Update listings $(TZ=Asia/Seoul date +%F)"
          git push
