  - handle: liveclubday
    name: Live Club Day

  - handle: gigguide.kr          # a gig listings account - check the report
    name: Gig Guide KR

  # Melon's main account is mostly K-pop releases and charts, not club shows.
  # It would add cost and noise, so it's off by default.
  # - handle: melon_music
  #   name: Melon

settings:
  # How many recent posts to pull per account each run
  posts_per_account: 12
  # Ignore posts older than this (days)
  max_post_age_days: 30
