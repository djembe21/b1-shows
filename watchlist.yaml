# b1.shows - watchlist
#
# Instagram usernames to check (without the @). Each must be a PUBLIC
# Business or Creator account - personal accounts are invisible to the API.
# The daily run writes data/fetch_report.json listing any handle that failed,
# so you can tell which ones need swapping out.
#
# Venues are the backbone: most shows get posted by the venue even when the
# band's own account is personal. Add bands and promoters on top of that.
#
# For venues, `aliases` are the other ways the venue gets written on posters
# (Korean name, short names). They're used to merge duplicate listings and to
# show one consistent English name on the site. `area` drives the area filter.
#
# Handles came from press and listing sites, not Instagram itself. The first
# run's fetch report will show which ones work.

venues:
  # --- Hongdae / Yeonnam ---
  - handle: hongdaeff
    name: Club FF
    name_ko: 클럽 FF
    area: Hongdae
    aliases: [FF, 클럽에프에프, 클럽 에프에프, Club FF Hongdae, 홍대FF]

  - handle: strangefruitseoul     # was strangefruit.seoul (invalid)
    name: Strange Fruit
    name_ko: 스트레인지 프룻
